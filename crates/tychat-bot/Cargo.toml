[package]
name = "tychat-bot"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Runner library for Tychat personal bots: pairing, the owner chat, verification and encryption (ADR-0034)."

[lib]
name = "tychat_bot"
path = "src/lib.rs"

[[bin]]
name = "tychat-bot-kit"
path = "src/bin/tychat-bot-kit.rs"
required-features = ["owner-kit"]

[[example]]
name = "echo"

[features]
default = []
owner-kit = []

[dependencies]
tychat-crypto = { path = "../crypto" }
tychat-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
rand_chacha = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
url = "2"
httpdate = "1"
