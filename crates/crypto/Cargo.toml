[package]
name = "tychat-crypto"
version = "0.0.0"
edition = "2021"
license = "UNLICENSED"
publish = false
description = "Tychat end-to-end encryption core: pure Rust, no IO, randomness injected (ADR-0001, ADR-0005)."

[lib]
name = "tychat_crypto"
path = "src/lib.rs"

[dependencies]
x25519-dalek = { version = "2", features = ["static_secrets", "reusable_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
chacha20poly1305 = "0.10"
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
hkdf = "0.12"
sha2 = "0.10"
rand_core = "0.6"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }
rand_chacha = "0.3"
